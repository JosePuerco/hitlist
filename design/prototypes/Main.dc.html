<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hitlist – Studio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
a{color:#e8e8e8}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
.eq{display:flex;align-items:flex-end;gap:7px;height:96px}
.eq span{display:block;width:12px;border-radius:6px;height:22px;transition:height .4s ease}
.eq.on span{animation:bounce 1.1s ease-in-out infinite}
.eq.on span:nth-child(2){animation-delay:-.2s}
.eq.on span:nth-child(3){animation-delay:-.5s}
.eq.on span:nth-child(4){animation-delay:-.1s}
.eq.on span:nth-child(5){animation-delay:-.7s}
.eq.on span:nth-child(6){animation-delay:-.35s}
.eq.on span:nth-child(7){animation-delay:-.6s}
@keyframes bounce{0%,100%{height:18px}50%{height:92px}}
.press{transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.press:active{transform:scale(.92)}
.reveal{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.reveal .y{animation:rise .7s cubic-bezier(.2,1.2,.3,1) .05s both}
.reveal .t{animation:rise .6s ease .18s both}
.reveal .a{animation:rise .6s ease .26s both}
.reveal .m{animation:rise .6s ease .36s both}
@keyframes pop{0%{transform:scale(.94) rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px; background: #121212; color: #ffffff; font-family: 'Figtree', system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px">Hitlist</span>
      <span style="font-size: 13px; font-weight: 600; color: #b3b3b3; background: #242424; padding: 5px 10px; border-radius: 999px">Karte {{card}}</span>
    </div>
    <a href="Einstellungen.dc.html" aria-label="Einstellungen" class="press" style="width: 44px; height: 44px; border-radius: 22px; background: #242424; color: #e8e8e8; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
    </a>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
    <sc-if value="{{notRevealed}}" hint-placeholder-val="{{ true }}">
      <div style="height: 350px; border-radius: 24px; background: #1e1e1e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
        <div class="{{eqClass}}" aria-hidden="true">
          <span style="background: {{accent}}"></span><span style="background: {{accent}}"></span><span style="background: {{accent}}"></span><span style="background: {{accent}}"></span><span style="background: {{accent}}"></span><span style="background: {{accent}}"></span><span style="background: {{accent}}"></span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 22px; font-weight: 700">Was läuft hier?</span>
          <span style="font-size: 15px; color: #b3b3b3; font-variant-numeric: tabular-nums">{{status}} · {{elapsed}}</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
      <div class="reveal" style="height: 400px; border-radius: 24px; background: #1e1e1e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; box-sizing: border-box; text-align: center">
        <span class="y" style="font-size: 96px; font-weight: 800; letter-spacing: -4px; line-height: 1; color: {{accent}}; font-variant-numeric: tabular-nums">1977</span>
        <div class="m" style="display: flex; align-items: center; gap: 12px">
          <span style="font-size: 13px; color: #b3b3b3; background: #2a2a2a; padding: 6px 10px; border-radius: 999px">Jahr laut MusicBrainz</span>
          <a href="Korrektur.dc.html" style="font-size: 13px; font-weight: 600">Jahr korrigieren</a>
        </div>
        <span class="t" style="font-size: 26px; font-weight: 700; margin-top: 14px">Dreams</span>
        <span class="a" style="font-size: 17px; color: #b3b3b3">Fleetwood Mac</span>
        <div class="m" style="display: flex; align-items: center; justify-content: space-between; align-self: stretch; margin-top: 18px; padding-top: 16px; border-top: 1px solid #2e2e2e">
          <span style="font-size: 11px; color: #a0a0a0; border: 1px dashed #555555; border-radius: 6px; padding: 6px 8px">[Spotify-Logo]</span>
          <a href="#" style="font-size: 13px; font-weight: 700; color: #ffffff; text-decoration: none; border: 1px solid #555555; border-radius: 999px; padding: 10px 14px">In Spotify öffnen</a>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 28px">
    <button aria-label="Nochmal von vorn" onClick="{{restart}}" class="press" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #242424; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
    </button>
    <button aria-label="{{playLabel}}" onClick="{{toggle}}" class="press" style="width: 80px; height: 80px; border-radius: 40px; border: none; background: {{accent}}; color: #0b0b0b; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </sc-if>
      <sc-if value="{{notPlaying}}" hint-placeholder-val="{{ false }}">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.6A1 1 0 0 0 8 5.5z"></path></svg>
      </sc-if>
    </button>
    <button aria-label="Auflösen" onClick="{{reveal}}" class="press" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #242424; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
  </div>

  <a href="Scanner.dc.html" class="press" style="height: 56px; border-radius: 28px; background: #ffffff; color: #0b0b0b; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"></path><path d="M8 12h8"></path></svg>
    Nächste Karte scannen
  </a>
  <span style="font-size: 12px; color: #a0a0a0; text-align: center">Handy umgedreht hinlegen: Sperrbildschirm zeigt den Titel</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4ADE80","options":["#4ADE80","#38BDF8","#F59E0B","#F472B6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: true, revealed: false, sec: 42, card: 12 }; }
  componentDidMount() { this.timer = setInterval(() => { if (this.state.playing) this.setState({ sec: this.state.sec + 1 }); }, 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state;
    const mm = Math.floor(s.sec / 60), ss = String(s.sec % 60).padStart(2, '0');
    return {
      accent: this.props.accent ?? '#4ADE80',
      playing: s.playing, notPlaying: !s.playing,
      revealed: s.revealed, notRevealed: !s.revealed,
      eqClass: s.playing ? 'eq on' : 'eq',
      status: s.playing ? 'Läuft' : 'Pausiert',
      elapsed: mm + ':' + ss,
      card: s.card,
      playLabel: s.playing ? 'Pause' : 'Abspielen',
      toggle: () => this.setState({ playing: !s.playing }),
      restart: () => this.setState({ sec: 0, playing: true }),
      reveal: () => this.setState({ revealed: !s.revealed }),
      next: () => this.setState({ revealed: false, sec: 0, playing: true, card: s.card + 1 })
    };
  }
}
</script>
</body>
</html>
