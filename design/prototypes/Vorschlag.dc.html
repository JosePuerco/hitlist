<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hitlist – Korrektur vorschlagen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
a{color:#e8e8e8}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
.sheet{animation:up .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes up{0%{transform:translateY(100%)}100%{transform:none}}
.done{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.press{transition:transform .15s cubic-bezier(.3,1.6,.5,1)}.press:active{transform:scale(.94)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #121212; color: #ffffff; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; padding: 56px 20px 20px; display: flex; flex-direction: column; justify-content: center; opacity: .35" aria-hidden="true">
    <div style="height: 220px; border-radius: 24px; background: #1e1e1e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
      <span style="font-size: 80px; font-weight: 800; letter-spacing: -3px; color: {{accent}}">2004</span>
      <span style="font-size: 22px; font-weight: 700">Dreams</span>
    </div>
  </div>
  <div class="sheet" style="background: #1e1e1e; border-radius: 28px 28px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #444444"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 24px; font-weight: 800">Korrektur vorschlagen</h2>
      <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600">Abbrechen</a>
    </div>
    <p style="margin: 0; font-size: 15px; color: #b3b3b3; line-height: 1.45">Schick die Zeile an Jan. Sobald er sie übernimmt, gilt das Jahr auf allen Geräten.</p>
    <div style="display: flex; align-items: center; justify-content: space-between; background: #121212; border-radius: 20px; padding: 10px">
      <button aria-label="Ein Jahr früher" onClick="{{minus}}" class="press" style="width: 56px; height: 56px; border-radius: 16px; border: none; background: #2a2a2a; color: #ffffff; font-size: 28px; font-weight: 600">−</button>
      <span style="font-size: 56px; font-weight: 800; letter-spacing: -2px; color: {{accent}}; font-variant-numeric: tabular-nums">{{year}}</span>
      <button aria-label="Ein Jahr später" onClick="{{plus}}" class="press" style="width: 56px; height: 56px; border-radius: 16px; border: none; background: #2a2a2a; color: #ffffff; font-size: 28px; font-weight: 600">+</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #a0a0a0">Wird geteilt</span>
      <code style="display: block; background: #121212; border: 1px solid #2e2e2e; border-radius: 12px; padding: 12px; font-size: 13px; color: #d6d6d6; line-height: 1.5">Hitlist-Korrektur: Dreams – Fleetwood Mac → {{year}} (Track 0ofHAoxe9vBkTCp2UQIavz)</code>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button onClick="{{copy}}" class="press" style="height: 56px; border-radius: 28px; border: none; background: #2a2a2a; color: #ffffff; font-size: 16px; font-weight: 700">{{copyLabel}}</button>
      <button class="press" style="height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #0b0b0b; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
        Teilen
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4ADE80","options":["#4ADE80","#38BDF8","#F59E0B","#F472B6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { year: 1977, copied: false }; }
  renderVals() {
    const s = this.state;
    return {
      accent: this.props.accent ?? '#4ADE80',
      year: String(s.year),
      copyLabel: s.copied ? 'Kopiert' : 'Kopieren',
      minus: () => this.setState({ year: s.year - 1, copied: false }),
      plus: () => this.setState({ year: s.year + 1, copied: false }),
      copy: () => this.setState({ copied: true })
    };
  }
}
</script>
</body>
</html>
