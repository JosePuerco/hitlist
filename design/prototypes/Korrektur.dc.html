<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hitlist – Jahr korrigieren</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
a{color:#e8e8e8}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.sheet{animation:up .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes up{0%{transform:translateY(100%)}100%{transform:none}}
.bump{animation:bump .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(.85)}100%{transform:none}}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.done{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.press{transition:transform .15s cubic-bezier(.3,1.6,.5,1)}.press:active{transform:scale(.94)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #121212; color: #ffffff; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; padding: 56px 20px 20px; display: flex; flex-direction: column; justify-content: center; opacity: .35" aria-hidden="true">
    <div style="height: 260px; border-radius: 24px; background: #1e1e1e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
      <span style="font-size: 80px; font-weight: 800; letter-spacing: -3px; color: {{accent}}">2004</span>
      <span style="font-size: 22px; font-weight: 700">Dreams</span>
    </div>
  </div>
  <div class="sheet" style="background: #1e1e1e; border-radius: 28px 28px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #444444"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 24px; font-weight: 800">Jahr korrigieren</h2>
      <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600">Abbrechen</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 700">Dreams · Fleetwood Mac</span>
      <span style="font-size: 14px; color: #b3b3b3">Bisher: 2004 (Spotify-Albumjahr, unsicher)</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; background: #121212; border-radius: 20px; padding: 10px">
      <button aria-label="Ein Jahr früher" onClick="{{minus}}" class="press" style="width: 56px; height: 56px; border-radius: 16px; border: none; background: #2a2a2a; color: #ffffff; font-size: 28px; font-weight: 600">−</button>
      <label style="display: flex; flex-direction: column; align-items: center">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Erscheinungsjahr</span>
        <input class="{{bumpClass}}" inputmode="numeric" value="{{year}}" readonly style="width: 160px; background: transparent; border: none; text-align: center; color: {{accent}}; font-size: 56px; font-weight: 800; letter-spacing: -2px; font-variant-numeric: tabular-nums">
      </label>
      <button aria-label="Ein Jahr später" onClick="{{plus}}" class="press" style="width: 56px; height: 56px; border-radius: 16px; border: none; background: #2a2a2a; color: #ffffff; font-size: 28px; font-weight: 600">+</button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #b3b3b3">
      Quelle (optional)
      <input placeholder="z. B. Single 1977" style="height: 48px; border-radius: 14px; border: 1px solid #333333; background: #121212; color: #ffffff; padding: 0 14px; font-size: 16px">
    </label>
    <sc-if value="{{notSaved}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{save}}" class="press" style="height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #0b0b0b; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
        <sc-if value="{{saving}}" hint-placeholder-val="{{ false }}">
          <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
        </sc-if>
        {{saveLabel}}
      </button>
      <span style="font-size: 13px; color: #a0a0a0; text-align: center">Gilt nach 1–2 Minuten auf allen Geräten.</span>
    </sc-if>
    <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
      <div class="done" style="height: 56px; border-radius: 28px; background: #1f3326; color: {{accent}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        Gespeichert für alle
      </div>
      <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Zurück zum Song</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4ADE80","options":["#4ADE80","#38BDF8","#F59E0B","#F472B6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { year: 1977, tick: 0, phase: 'idle' }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    return {
      accent: this.props.accent ?? '#4ADE80',
      year: String(s.year),
      bumpClass: s.tick % 2 ? 'bump' : '',
      saving: s.phase === 'saving',
      notSaved: s.phase !== 'saved',
      saved: s.phase === 'saved',
      saveLabel: s.phase === 'saving' ? 'Speichere …' : 'Für alle speichern',
      minus: () => this.setState({ year: s.year - 1, tick: s.tick + 1 }),
      plus: () => this.setState({ year: s.year + 1, tick: s.tick + 1 }),
      save: () => { this.setState({ phase: 'saving' }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ phase: 'saved' }), 1400); }
    };
  }
}
</script>
</body>
</html>
